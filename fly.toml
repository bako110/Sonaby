# fly.toml app configuration file generated for backend-sonaby on 2025-11-19T14:04:44+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-sonaby'
primary_region = 'ams'

[build]

[deploy]
# Génère le client Prisma uniquement (db push doit être fait manuellement si nécessaire)
release_command = 'npx prisma generate'

[http_service]
internal_port = 5000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[[vm]]
memory = '1gb'
cpu_kind = 'shared'
cpus = 1

[mounts]
source="uploads"
destination="/uploads"
